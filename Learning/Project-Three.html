<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Changer</title>
    <style>
       body {
        background-color: black;
        color: white;
        text-align: center;
       }

       .image_container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
       }

       .image_container img {
        height: 300px;
        width: 400px;
        border: 2px solid white;
        border-radius: 10px;
       }

        h1 {
        font-size: 50px;
       }

       .image_container h2{
        background-color: rgb(2, 52, 160);
        color: white;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid white;
       }

       /* Tablet / iPad */
@media (max-width: 1024px) {
    h1 {
        font-size: 42px;
    }

    .image_container img {
        width: 70%;
        max-width: 400px;
        height: auto;
    }

    .image_container h2 {
        font-size: 24px;
        padding: 8px 25px;
    }
}


/* Mobile */
@media (max-width: 600px) {
    body {
        padding: 0 15px;
    }

    h1 {
        font-size: 34px;
        margin: 30px 0;
    }

    .image_container {
        width: 100%;
    }

    .image_container img {
        width: 100%;
        max-width: 400px;
        height: auto;
        aspect-ratio: 4 / 3;
        object-fit: cover;
    }

    .image_container h2 {
        font-size: 22px;
        padding: 8px 25px;
        margin-top: 15px;
    }
}


/* Small Mobile */
@media (max-width: 400px) {
    h1 {
        font-size: 28px;
        margin: 25px 0;
    }

    .image_container img {
        width: 100%;
        aspect-ratio: 4 / 3;
    }

    .image_container h2 {
        font-size: 20px;
        padding: 7px 20px;
    }
}

    </style>
</head>
<body>
    <h1>Image Changer</h1>
    <div class="image_container">
        <img src="Image-One.jpg" alt="">
        <h2>London</h2>
    </div>
    <script>
        let img = document.querySelector('img');
        let h2 = document.querySelector('h2')
        let prevSrc = img.src
        let prevText = h2.innerText

        img.addEventListener('mouseover',()=> {
            img.src = 'Image-Two.jpg'
            h2.innerText = 'Paris'
        })

        img.addEventListener('mouseleave',()=> {
            img.src = 'Image-One.jpg'
            h2.innerText = 'London'
        })
    </script>
</body>
</html>
